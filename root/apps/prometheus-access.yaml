apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jacoloves/argocd-apps.git
    targetRevision: HEAD
    path: apps/prometheus-access
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
