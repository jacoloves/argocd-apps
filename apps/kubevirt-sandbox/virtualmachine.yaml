# KubeVirt 検証用の VM。片付け時はこの Application を先に消してから KubeVirt 本体を撤去すること
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-sandbox
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        # Service の selector 用。VMI と virt-launcher Pod の両方に付与される
        app: ubuntu-sandbox
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          # ワーカーのメモリに余裕がないため最小構成にする
          guest: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              # Pod ネットワークに NAT で接続する。Cilium でも追加設定なしで動く
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          # 一時ディスク。Longhorn を使わないため、バックアップ対象にならず SSD の書き込みも増えない
          # 再起動するとディスクの変更は消える（検証項目の1つ）
          # excalidraw と同じくダイジェストで固定する
          containerDisk:
            image: quay.io/containerdisks/ubuntu:24.04@sha256:ea164c514b308286bdc179b403298efd2d8ae549af518a82a029e1bbb027f3a4
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: shotaro
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  # リポジトリが PUBLIC なので公開鍵のみを書く。パスワードは設定しない
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGfaiIyDa7qCzMqjpHfnBMEmkFC28YoPTxyKuJ4UwwMp stanaka@ShotaronoMacBook-Air.local # MacBook
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJPj2C1M/HM0gX3bNgZmcKjYokX0HKnW36PT8CvrQfa8 mgmt@thinkcentre # mgmt host（予備）
              # ゲストエージェントを入れると、VMI に IP や OS 情報が表示されるようになる
              packages:
                - qemu-guest-agent
                - nginx
              runcmd:
                - systemctl enable --now qemu-guest-agent
                # 起動時刻をページに埋め込む。ライブマイグレーションの前後で値が変わらなければ「再起動していない」証拠になる
                - 'echo "<h1>Hello from KubeVirt VM</h1><p>host: $(hostname)</p><p>booted at: $(date -Is)</p>" > /var/www/html/index.html'
                - systemctl enable --now nginx
