# VM への受信を Gateway からの HTTP のみに制限する検証用ポリシー
# VM の実体は virt-launcher Pod なので、Pod と同じくラベルで対象を選べる
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ubuntu-sandbox-ingress
spec:
  endpointSelector:
    matchLabels:
      app: ubuntu-sandbox
  ingress:
    # Cilium の Gateway(Envoy) からの通信は予約エンティティ "ingress" として扱われる
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # virtctl ssh / port-forward は kube-apiserver → virt-api → VM の Pod IP と届く（Hubble で確認済み）。
    # SSH は virt-api 経由のみ許可し、利用可否は Kubernetes の RBAC(portforward サブリソース)で制御する
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kubevirt
            kubevirt.io: virt-api
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
