# Phase 4 の「Pod から Service 経由で VM に届くか」の確認用。クラスタ内のみで公開する
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-sandbox
spec:
  type: ClusterIP
  selector:
    app: ubuntu-sandbox
  ports:
    - name: ssh
      port: 22
      targetPort: 22
    # Gateway(HTTPRoute) から VM の nginx へ転送する
    - name: http
      port: 80
      targetPort: 80
