# VM 上の nginx を既存の Gateway とワイルドカード証明書で公開する（LAN 内のみ）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ubuntu-sandbox
  namespace: kubevirt-sandbox
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - vm.shooonng.com
  rules:
    - backendRefs:
        - name: ubuntu-sandbox
          port: 80
