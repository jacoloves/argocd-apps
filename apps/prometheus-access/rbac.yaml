apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-external
  namespace: prometheus-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-external
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-external
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-external
subjects:
  - kind: ServiceAccount
    name: prometheus-external
    namespace: prometheus-access
---
# 期限なしのトークンを得るため Secret を明示的に作る。
# 1.24 以降、ServiceAccount は自動でトークン Secret を作らない。
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-external-token
  namespace: prometheus-access
  annotations:
    kubernetes.io/service-account.name: prometheus-external
type: kubernetes.io/service-account-token