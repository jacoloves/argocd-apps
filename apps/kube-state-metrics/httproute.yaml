# mgmt host の Prometheus から scrape させるため Gateway 経由で公開する。
# 内部限定(Cloudflare Tunnel には載せない)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-state-metrics
  namespace: kube-state-metrics
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ksm.shooonng.com
  rules:
    - backendRefs:
        - name: kube-state-metrics
          port: 8080