# 内部限定(Cloudflare Tunnel には載せない)。
# 共有 Gateway 経由で TLS 終端する。ワイルドカード証明書(*.shooonng.com)と
# AdGuard の rewrite が既にあるため、DNS・証明書の追加作業は不要。
# クリップボード API や PWA は HTTPS(secure context)が前提なので http は https へ転送する。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw
  namespace: excalidraw
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - excalidraw.shooonng.com
  rules:
    - backendRefs:
        - name: excalidraw
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: excalidraw-redirect
  namespace: excalidraw
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - excalidraw.shooonng.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
