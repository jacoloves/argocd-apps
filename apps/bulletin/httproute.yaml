# 共有 Gateway に乗り入れる。/api→backend, /→frontend の同一オリジン。
# TLS はワイルドカード証明書で Gateway 側が終端するため、
# アプリごとの Certificate と cert-manager の注釈は不要になった。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bulletin
  namespace: bulletin
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - bulletin.shooonng.com
  rules:
    # Gateway API は最長一致を優先するため、Ingress と違い記述順に依存しない
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bulletin-backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bulletin-frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bulletin-redirect
  namespace: bulletin
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - bulletin.shooonng.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
